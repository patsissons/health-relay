# Generates HealthRelay.xcodeproj: `cd ios && xcodegen`. The project is not
# committed; this file is its source. Signing: copy Local.xcconfig.example
# to Local.xcconfig and set your team.
name: HealthRelay
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HealthRelayKit:
    path: HealthRelayKit
targets:
  HealthRelay:
    type: application
    platform: iOS
    sources:
      - path: HealthRelay
    dependencies:
      - package: HealthRelayKit
    info:
      path: HealthRelay/Info.plist
      properties:
        CFBundleDisplayName: Health Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Health Relay reads your Health data to send each day to the destinations you add. Nothing is sent anywhere else.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.patsissons.healthrelay.refresh]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Setup links (healthrelay://destination?url=...), usually scanned from a QR code.
        CFBundleURLTypes:
          - CFBundleURLName: com.patsissons.healthrelay.setup
            CFBundleURLSchemes: [healthrelay]
    entitlements:
      path: HealthRelay/HealthRelay.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patsissons.healthrelay
        PRODUCT_NAME: HealthRelay
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Merged into Info.plist; only Debug on the simulator writes samples (the Seed tab).
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          INFOPLIST_KEY_NSHealthUpdateUsageDescription: Debug builds write synthetic samples so the app can be tried on a simulator.
  HealthRelayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HealthRelayUITests
    dependencies:
      - target: HealthRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patsissons.healthrelay.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  HealthRelay:
    build:
      targets:
        HealthRelay: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: HealthRelayKit/HealthRelayKitTests
        - name: HealthRelayUITests
    archive:
      config: Release
