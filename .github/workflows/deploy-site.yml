name: Deploy site

# Publishes site/ to Cloudflare when something the site is built from changes
# on main: site/ itself, or the docs scripts/sync-docs.mjs copies into it.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/schema.md
      - docs/design.md
      - docs/receivers.md
      - docs/templates.md
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read

# Deploys take turns, so the newest always lands last.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          # Each page's "last updated" date comes from its git history.
          fetch-depth: 0

      # pnpm version resolves from the packageManager field in site/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Also checks every internal link, so a broken one stops the deploy.
      - run: pnpm build

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
